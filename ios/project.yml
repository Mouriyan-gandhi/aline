name: Aline
options:
  bundleIdPrefix: com.aline
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Aline:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Aline
    info:
      path: Aline/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Aline
        NSPhotoLibraryUsageDescription: "Aline uses your photo library to let you attach a resume or certificate image."
        UIAppFonts:
          - Inter.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aline.app
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
